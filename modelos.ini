; Qual modelo faz cada papel. Mude aqui e rode de novo: python instalar.py <ferramenta>
; Deixou vazio? O papel usa o mesmo modelo da conversa principal.
; esforco_* é o quanto o modelo pensa; vazio usa o padrão dele.

[claude]
; opus, sonnet, haiku, fable, inherit ou o nome completo do modelo.
; Estes padrões gastam bastante: foram pensados para o plano Max.
; Plano menor? Experimente executor = sonnet, revisor = sonnet, search = haiku e esforço vazio.
executor = opus
revisor = opus
search = sonnet
; low, medium, high, xhigh, max
esforco_executor = max
esforco_revisor = max
esforco_search =

